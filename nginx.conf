events {
    worker_connections 1024;
}

http {
    upstream backend {
        server app:3001;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }

        location / {
            # In a real production setup, Nginx would serve the built frontend files
            # For now, we proxy to the app which also contains the built frontend
            proxy_pass http://backend;
        }
    }
}
